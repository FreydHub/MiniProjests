services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kepler_api
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: kepler_ui
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      FEATURE_LENGTH: "111"
      SEQUENCE_LENGTH: "256"

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: kepler_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      api:
        condition: service_healthy
